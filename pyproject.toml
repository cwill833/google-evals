[project]
name = "google-agent-evals-demo"
version = "0.1.0"
description = "Native Google Agents CLI evaluation and deterministic release gate reference"
requires-python = ">=3.11,<3.14"
dependencies = [
  "google-agents-cli==1.11.0",
  "google-adk==2.12.0",
  "google-cloud-aiplatform[evaluation]==2.2.0",
]

[dependency-groups]
dev = ["pytest==9.0.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
